name: Temporary Prettier preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format and print exact diff
        run: |
          npx prettier --write src/components/Workbench.tsx src/lib/prompt/registry.ts
          git diff -- src/components/Workbench.tsx src/lib/prompt/registry.ts
