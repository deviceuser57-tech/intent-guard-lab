name: Temporary Prettier repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format files with repository Prettier
        run: npx prettier --write src/components/Workbench.tsx tests/guardrail-policy.test.mjs
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/Workbench.tsx tests/guardrail-policy.test.mjs
            git commit -m "Apply Prettier formatting to Playground changes"
            git push origin HEAD:main
          fi
