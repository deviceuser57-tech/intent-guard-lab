name: Prompt engine regression checks

on:
  pull_request:
  push:
    branches:
      - main
      - "improvements/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Check formatting and lint
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start browser acceptance server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/acceptance-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/acceptance-preview.log
          exit 1
      - name: Run browser acceptance checks
        run: node scripts/capture-guide-screenshots.mjs
      - name: Upload browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-guard-browser-acceptance
          path: public/guide-screenshots/*.png
          if-no-files-found: warn
