name: Capture real user-guide screenshots (dev server)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/capture-guide-screenshots.mjs"
      - "docs/**"
      - ".github/workflows/capture-guide-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Playwright Chromium without changing the lockfile
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Start preview server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/preview.log
          exit 1
      - name: Capture screenshots from the running app
        run: node scripts/capture-guide-screenshots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide-screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
          else
            git commit -m "Add real UI screenshots to user guide"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
