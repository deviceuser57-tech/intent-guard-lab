name: One-time Prettier repair

on:
  push:
    branches:
      - fix/ci-prettier-formatting

permissions:
  contents: write

jobs:
  format-and-commit:
    if: "!contains(github.event.head_commit.message, '[prettier-repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-prettier-formatting
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format source files
        run: npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css,md}"
      - name: Remove temporary repair workflow
        run: git rm .github/workflows/format-fix.yml
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "[prettier-repair] Format source files and remove temporary workflow"
          git push origin HEAD:fix/ci-prettier-formatting
