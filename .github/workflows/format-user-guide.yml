name: Format Help & User Guide changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-user-guide.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format changed UI files
        run: npx prettier --write src/components/Workbench.tsx src/components/HelpUserGuide.tsx src/styles.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Workbench.tsx src/components/HelpUserGuide.tsx src/styles.css
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
          else
            git commit -m "Format Help & User Guide UI"
            git push
          fi
